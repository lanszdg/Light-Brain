[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightbrain-coding"
version = "1.1.0"
description = "Persistent, graph-directed coding agent"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28"]

[project.optional-dependencies]
browser = ["playwright>=1.54,<2"]
graph = ["networkx>=3.4,<4","clingo>=5.8,<6"]
templates = ["copier>=9.6,<10"]

[project.scripts]
lb = "lightbrain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lightbrain*"]
namespaces = true

[tool.setuptools.package-data]
"lightbrain.store" = ["schema.sql"]
"lightbrain" = ["recipes_data/**/*", "web/*"]
